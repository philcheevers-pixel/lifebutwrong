<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2332">
  <meta name="description" content="Phone input for word drop. Type or paste. Words stay when you leave the window.">
  <title>Phone input — word drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <p class="brand">Phone input</p>
      <p class="tag">Word drop · stays when the window changes</p>
    </header>

    <main>
      <label class="sr-only" for="bench">Your words</label>
      <textarea
        id="bench"
        name="bench"
        rows="8"
        autocomplete="off"
        autocorrect="on"
        autocapitalize="sentences"
        spellcheck="true"
        enterkeyhint="enter"
        inputmode="text"
        placeholder="Put the word here before it leaves."
        aria-describedby="status"
      ></textarea>

      <p id="status" class="status" aria-live="polite">Ready.</p>

      <div class="actions" role="group" aria-label="Bench actions">
        <button type="button" id="btn-copy">Copy</button>
        <button type="button" id="btn-colour" aria-pressed="false">Colour</button>
        <button type="button" id="btn-clear" class="danger">Clear</button>
      </div>
    </main>

    <footer class="foot">
      <p>Saved on this phone only. Nothing is sent.</p>
    </footer>
  </div>
  <script src="bench.js"></script>
</body>
</html>
